name: Build AI Engineering Android APK
on:
  push:
    branches: [build/aiefs-android-reader]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: aiefs-mobile
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Engineering-Android-APK
          path: aiefs-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish downloadable APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp aiefs-mobile/app/build/outputs/apk/debug/app-debug.apk AI-Engineering-zhTW-v1.2-FIXED.apk
          gh release create aiefs-zhTW-v1.2.0 \
            AI-Engineering-zhTW-v1.2-FIXED.apk \
            --title "AI Engineering Mobile 繁體中文 v1.2" \
            --notes "Unofficial Android reader. Fixes a redirect loop on lesson pages. Technical English terms remain visible. Android 8+. This is a debug-signed APK and has not been tested on a physical phone." \
            --target "${GITHUB_SHA}" --prerelease --repo "${GITHUB_REPOSITORY}"
